# -----------------------------------------------------
# Atajos de Teclado (Hyprland Keybindings)
# -----------------------------------------------------

$mainMod = SUPER

# 🚀 Aplicaciones y Lanzadores
bind = $mainMod, D, exec, rofi -show drun                     # Lanzador de Aplicaciones (App Launcher)
bind = $mainMod, RETURN, exec, kitty                          # Terminal (Kitty)
bind = $mainMod, B, exec, google-chrome                       # Navegador Web (Google Chrome / Browser)
bind = $mainMod, E, exec, nautilus                            # Gestor de Archivos (Nautilus)
bind = $mainMod, S, exec, pkill rofi || true && rofi -show run # Ejecutar comandos (Rofi Run)
bind = $mainMod CTRL, S, exec, rofi -show window              # Selector de Ventanas activas (Window Switcher)
bind = $mainMod ALT, V, exec, ~/.config/ml4w/scripts/ml4w-cliphist # Gestor de Portapapeles (Clipboard)
bind = $mainMod, A, exec, qs -p ~/.config/quickshell/overview ipc call overview toggle # Vista general (Overview)

# 🪟 Gestión de Ventanas
bind = $mainMod, Q, killactive,                               # Cerrar ventana activa
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Forzar cierre
bind = $mainMod SHIFT, F, fullscreen, 0                       # Pantalla Completa (Toggle Fullscreen)
bind = $mainMod CTRL, F, fullscreen, 1                        # Maximizar ventana
bind = $mainMod, SPACE, togglefloating,                       # Alternar ventana flotante

# 🧭 Navegación y Foco entre Ventanas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# 🔁 Mover Ventanas en Tiling
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# 📐 Redimensionar Ventanas (Teclado)
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# 🖱️ Mover y Redimensionar con Ratón (Click + Arrastrar)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# 🔢 Espacios de Trabajo (Workspaces 1 - 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 📦 Mover Ventana a Espacio de Trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 📸 Capturas de Pantalla (Screenshots)
bind = $mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh --instant
bind = $mainMod SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh --instant-area

# ⚙️ Sistema y Control
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw          # Panel de Notificaciones
bind = $mainMod, L, exec, ~/.config/ml4w/scripts/ml4w-power -l # Bloquear Pantalla (Lock)
bind = $mainMod CTRL, R, exec, hyprctl reload                 # Recargar Configuración de Hyprland
bind = CTRL ALT, Delete, exit,                                # Salir de Hyprland
